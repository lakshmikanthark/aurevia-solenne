<svg xmlns="http://www.w3.org/2000/svg" width="660" height="500" viewBox="0 0 660 500" role="img" aria-labelledby="title desc"><title id="title">Atelier spatial concept</title><desc id="desc">An original abstract diagram showing relationships between shared rooms, a quiet wing and private outdoor space. Not to scale and not a room-by-room floor plan.</desc><rect width="660" height="500" fill="#eae1d6"/><g stroke="#381724" fill="none" stroke-width="2"><path d="M65 75H575V395H65Z"/><path d="M65 200H280V75M280 200H575M280 200V395M420 200V395"/><path d="M98 235H245V355H98Z" stroke-dasharray="4 5"/><path d="M83 65H258M295 65H559M585 93V178M585 220V376" stroke-width="5"/><path d="M100 395v15h450v-15" stroke-width="1"/></g><g font-family="Georgia,serif" fill="#381724" text-anchor="middle"><text x="172" y="137" font-size="24">Quiet wing</text><text x="427" y="139" font-size="25">Living &amp; dining</text><text x="172" y="291" font-size="16">GARDEN ROOM</text><text x="350" y="291" font-size="20">Threshold</text><text x="497" y="291" font-size="20">Private wing</text></g><g font-family="Arial,sans-serif" fill="#6a565d" text-anchor="middle"><text x="330" y="450" font-size="11" letter-spacing="2">RELATIONSHIP STUDY · NOT TO SCALE</text><text x="330" y="474" font-size="10">A conceptual zoning diagram, not a construction drawing.</text></g></svg>